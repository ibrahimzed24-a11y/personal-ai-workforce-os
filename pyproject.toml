[project]
name = "ai-workforce-os"
version = "0.1.0"
description = "Sovereign AI Workforce OS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography<=48.0.1",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
local = [
    "browser-use>=1.0.5",
    "playwright>=1.65.2",
]

[project.scripts]
ai-workforce-os = "ai_workforce_os:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
